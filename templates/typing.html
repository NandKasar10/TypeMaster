<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TypeMaster</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;700&display=swap" rel="stylesheet">
    <!-- <link rel="stylesheet" href="../static/css/style.css"> -->
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>
    <div id="typing-test-page">
        <header class="typing-header">
            <div class="container">
                <div class="logo">TypeMaster</div>
                <div class="timer-selector">
                    <span>Timer:</span>
                    <button class="btn-timer active">15s</button>
                    <button class="btn-timer">30s</button>
                    <button class="btn-timer">60s</button>
                    <button class="btn-timer">120s</button>
                </div>
                <div class="header-actions">

                    <a href="/" class="btn btn-secondary">Home</a>

                    <button class="btn-icon" aria-label="Theme Toggle">☀️</button>
                    <button class="btn-icon profile-icon" aria-label="Profile"></button>
                </div>
            </div>
        </header>

        <main class="typing-area-container">
            <div class="container">
                <div class="typing-box card">
                    <p id="paragraph" class="paragraph-display">
                         {{ paragraph }}
                    </p>
                    <input type="text" class="typing-input" placeholder="Start typing here...">
                </div>

                <div class="stats-cards">
                    <div class="card stat-card">
                        <p>WPM</p>
                        <h3 id="current-wpm">0</h3>
                    </div>
                    <div class="card stat-card">
                        <p>Accuracy</p>
                        <h3 id="current-accuracy">0%</h3>
                    </div>
                    <div class="card stat-card">
                        <p>Errors</p>
                        <h3 id="current-errors">0</h3>
                    </div>
                    <div class="card stat-card">
                        <p>Chars Typed</p>
                        <h3 id="current-chars">0</h3>
                    </div>
                    <div class="card stat-card">
                        <p>Time Remaining</p>
                        <h3 id="time-remaining">60s</h3>
                    </div>
                </div>

                <div class="typing-actions">
                    <button class="btn btn-secondary">Restart</button>
                    <button class="btn btn-primary">New Text</button>
                </div>
            </div>
        </main>
    </div>

    <script src="{{ url_for('static', filename='js/script.js') }}"></script>
</body>
</html>
